[workspace]
resolver = "2"
members = ["core", "cli", "host", "board", "validation", "xtask"]

# The fixture is a workspace of its own: the projects the subcommand is run on,
# each with its own profile target. Excluded rather than made members, so a
# deliberately broken fixture never has to satisfy this workspace's build, and
# so `cargo package` never ships a corpus its tests could not run.
exclude = ["fixture"]

# One version for every member: the published crates release together.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/umbgtt10/stingy4rust"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]

# Declared once here; every member takes them with `.workspace = true`, so a
# version is bumped in one place and no two members can disagree.
[workspace.dependencies]
# The published core, taken by path so host and the tools around it build
# against this checkout; its version, because a published host names one.
stingy4rust-core = { path = "core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# The core's one dependency: a lock built in a `const fn` and taken without
# allocating, so a `static` allocator's ledger is `Sync` with no `unsafe`.
spin = { version = "0.12", default-features = false, features = ["spin_mutex"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# The house's gates, as a library: xtask takes every gate it shares with the
# other repositories from here, and keeps only its own.
serge4rust = "0.3.2"
syn = { version = "3.0.10", features = ["full", "visit"] }
tempfile = "3"

# The gates ripe4rust runs over a planned change, as this repository runs them.
[workspace.metadata.ripe4rust]
gates = ["just stage1", "just stage2"]

# The moves held back, each with its reason and the day it is looked at again.
[workspace.metadata.ripe4rust.pins]
rust = { reason = "just stage1: clippy on 1.100.1 refuses host/src/profile_main.rs:51 under -D warnings: this function has a #[must_use] attribute with no message, but returns a type already considered as #[must_use] (clippy::double_must_use)", review = "2026-12-12" }
