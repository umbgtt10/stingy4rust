[package]
name = "cargo-stingy4rust"
description = "A cargo subcommand that holds a Rust codebase to budgets of heap, peak heap, storage and wire bytes under fixed load profiles. In development: this release reserves the name."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["cargo-subcommand", "allocation", "memory", "budget", "ci"]
categories = ["development-tools::cargo-plugins", "memory-management"]

autotests = false

[lib]
name = "stingy4rust_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-stingy4rust"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stingy4rust-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# No `unsafe` in any target, tests included.
[lints.rust]
unsafe_code = "forbid"

# The family's configuration: pedantic and nursery at warn, which stage 1's
# -D warnings turns into errors.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
module_name_repetitions = "allow"
