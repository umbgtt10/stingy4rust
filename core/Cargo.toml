[package]
name = "stingy4rust-core"
description = "The measuring behind cargo-stingy4rust: a Rust codebase's heap, peak heap, storage and wire bytes under fixed load profiles. In development: this release reserves the name."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["allocation", "memory", "budget", "profiling", "ci"]
categories = ["development-tools", "memory-management"]

autotests = false

[lib]
name = "stingy4rust"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

# The technology-free counting: spin alone. xtask's technology-free gate
# holds this list to it.
[dependencies]
spin = { workspace = true }

# No `unsafe` in any target, tests included; the crate root says so as well.
[lints.rust]
unsafe_code = "forbid"

# The family's configuration: pedantic and nursery at warn, which stage 1's
# -D warnings turns into errors.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
module_name_repetitions = "allow"
# The design names each type's module after it, inside a folder named for its
# role -- stingy4rust::ledger::ledger::Ledger, stingy4rust::run::run::Run -- as
# stern4rust's named-subject rule asks; a type that is its role's namesake
# shares the folder's name.
module_inception = "allow"
