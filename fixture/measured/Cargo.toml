# Profiles whose figures are known exactly, run under the host's counting
# allocator: the tool's own corpus, and in slice 3 the budget it gates itself
# with. Every allocation goes through black_box, so the optimiser keeps it.
[package]
name = "measured"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[test]]
name = "stingy"
path = "tests/stingy.rs"
harness = false

[dev-dependencies]
stingy4rust-core = { path = "../../core" }
stingy4rust-host = { path = "../../host" }
