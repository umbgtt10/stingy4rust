# A ledger of eight blocks, and a profile that keeps nine alive: the run's
# status is blocks-exhausted, and the subcommand exits 2.
[package]
name = "overflowing"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[test]]
name = "stingy"
path = "tests/stingy.rs"
harness = false

[dev-dependencies]
stingy4rust-core = { path = "../../core" }
stingy4rust-host = { path = "../../host" }
